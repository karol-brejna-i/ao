# Copy of xpu_test.yml, adapted to run on our own self-hosted 2x Intel Data
# Center GPU Max 1550 (Ponte Vecchio) runner registered against this fork,
# instead of the org-wide `linux.idc.xpu` pool (which is only usable by repos
# inside the pytorch org's runner group).
#
# Naming/structure aligned with a more mature parallel analysis of this same
# problem (see runner-setup-analysis.md §6 for a summary and links to upstream
# PRs #4510/#4511/#4512/#4532, which add real XPU support for the distributed
# tests this workflow runs).
#
# Differences from the upstream xpu_test.yml:
#  - runs-on targets our self-hosted runner labels instead of linux.idc.xpu.
#  - Drops the AWS OIDC role assumption + private ECR login (that trust
#    relationship is scoped to the pytorch org and does not work from a fork).
#    Instead, the docker image tag is still computed by the same
#    calculate-docker-image action (a local hash calculation, no AWS needed),
#    then pulled directly from the public ghcr.io mirror. Since AWS OIDC is no
#    longer used, `permissions.id-token` is dropped too (least privilege).
#  - GPU-count health checks require >=2 GPUs (`-lt 2`), not just >=1, since
#    this workflow is specifically for 2-card/multi-GPU distributed tests.
#  - Uses a dedicated test script (ci_test_xpu_2card.sh) that delegates to the
#    repo's own 2-GPU distributed test scripts instead of the full single-GPU
#    suite.

name: xpu-2card-test

on:
  push:
    tags:
      - ciflow/xpu-2card/*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xpu_2card_ci_test-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 120
    runs-on: [self-hosted, xpu, pvc-2]
    env:
      DOCKER_IMAGE: ci-image:pytorch-linux-noble-xpu-n-py3
      PYTORCH_RETRY_TEST_CASES: 1
      PYTORCH_OVERRIDE_FLAKY_SIGNAL: 1
      XLA_CLANG_CACHE_S3_BUCKET_NAME: ossci-compiler-clang-cache-circleci-xla
    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@v4
        with:
          repository: pytorch/pytorch
          ref: nightly
          path: pytorch
          fetch-depth: 1
          submodules: false

      - name: Checkout Torchao (ao)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.head_ref || github.ref }}
          path: torchao
          fetch-depth: 1
          submodules: recursive

      - name: Clean all stopped docker containers
        if: always()
        shell: bash
        run: |
          # Prune all stopped containers.
          # If other runner is pruning on this node, will skip.
          nprune=$(ps -ef | grep -c "docker container prune")
          if [[ $nprune -eq 1 ]]; then
            docker container prune -f
          fi

      - name: Runner health check system info
        if: always()
        shell: bash
        run: |
          cat /etc/os-release || true
          cat /etc/apt/sources.list.d/oneAPI.list || true
          cat /etc/apt/sources.list.d/intel-gpu-jammy.list || true
          whoami

      - name: Runner health check xpu-smi
        if: always()
        shell: bash
        run: |
          timeout 30 xpu-smi discovery || true

      - name: Runner health check GPU count
        if: always()
        shell: bash
        run: |
          ngpu=$(timeout 30 xpu-smi discovery | grep -c -E 'Device Name' || true)
          msg="Please file an issue on this fork reporting the faulty runner. Include a link to the runner logs so the runner can be identified"
          if [[ $ngpu -lt 2 ]]; then
            echo "Error: Expected at least 2 GPUs on the runner, found $ngpu"
            echo "$msg"
            exit 1
          fi

      - name: Runner diskspace health check
        uses: pytorch/pytorch/.github/actions/diskspace-cleanup@main
        if: always()

      - name: Runner health check disconnect on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          killall runsvc.sh

      - name: Preserve github env variables for use in docker
        shell: bash
        run: |
          env | grep '^GITHUB' >> "/tmp/github_env_${GITHUB_RUN_ID}"
          env | grep '^CI' >> "/tmp/github_env_${GITHUB_RUN_ID}"

      - name: XPU set GPU_FLAG
        shell: bash
        run: |
          # Add render group for container creation.
          render_gid=`cat /etc/group | grep render | cut -d: -f3`
          echo "GPU_FLAG=--device=/dev/mem --device=/dev/dri --group-add video --group-add $render_gid" >> "${GITHUB_ENV}"

      - name: Calculate docker image
        id: calculate-docker-image
        uses: pytorch/test-infra/.github/actions/calculate-docker-image@main
        with:
          docker-image-name: ${{ env.DOCKER_IMAGE }}
          working-directory: pytorch
          repo-name: pytorch

      - name: Pull docker image from public ghcr.io mirror
        id: pull-ghcr-image
        env:
          ECR_DOCKER_IMAGE: ${{ steps.calculate-docker-image.outputs.docker-image }}
        shell: bash
        run: |
          tag=${ECR_DOCKER_IMAGE##*:}
          ghcr_image="ghcr.io/pytorch/ci-image:${tag/:/-}"
          echo "Pulling ${ghcr_image}"
          docker pull "${ghcr_image}"
          echo "DOCKER_IMAGE=${ghcr_image}" >> "${GITHUB_ENV}"

      - name: Runner health check GPU count
        if: always()
        shell: bash
        run: |
          ngpu=$(timeout 30 clinfo -l | grep -c -E 'Device' || true)
          msg="Please file an issue on this fork reporting the faulty runner. Include a link to the runner logs so the runner can be identified"
          if [[ $ngpu -lt 2 ]]; then
            echo "Error: Expected at least 2 GPUs on the runner, found $ngpu"
            echo "$msg"
            exit 1
          fi

      - name: Test
        id: test
        env:
          TEST_COMMAND: torchao/.github/scripts/ci_test_xpu_2card.sh
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA1: ${{ github.event.pull_request.head.sha || github.sha }}
        timeout-minutes: 120
        run: |
          set -x

          # detached container should get cleaned up by teardown_ec2_linux
          # Used for GPU_FLAG since that doesn't play nice
          # shellcheck disable=SC2086,SC2090
          container_name=$(docker run \
            ${GPU_FLAG:-} \
            -e PR_NUMBER \
            -e GITHUB_ACTIONS \
            -e GITHUB_REPOSITORY \
            -e GITHUB_WORKFLOW \
            -e GITHUB_JOB \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_NUMBER \
            -e GITHUB_RUN_ATTEMPT \
            -e JOB_ID \
            -e BRANCH \
            -e SHA1 \
            --user $(id -u):$(id -g) \
            --ulimit stack=10485760:83886080 \
            --ulimit core=0 \
            --security-opt seccomp=unconfined \
            --cap-add=SYS_PTRACE \
            --shm-size="8g" \
            --tty \
            --detach \
            --name="${container_name}" \
            --user jenkins \
            --privileged \
            -v "${GITHUB_WORKSPACE}:/var/lib/jenkins/workspace" \
            -w /var/lib/jenkins/workspace \
            "${DOCKER_IMAGE}"
          )
          # save container name for later step
          echo "CONTAINER_NAME=${container_name}" >> "$GITHUB_ENV"
          # jenkins user does not have write permission to mounted workspace; work-around by copying within container to jenkins home
          docker exec -t "${container_name}" sh -c "bash ${TEST_COMMAND}"

      - name: Collect backtraces from coredumps (if any)
        if: always()
        run: |
          # shellcheck disable=SC2156
          find . -iname "core.[1-9]*" -exec docker exec "${CONTAINER_NAME}" sh -c "gdb python {} -ex 'bt' -ex 'q'" \;

      - name: Stop container before exit
        if: always()
        run: |
          # Workaround for multiple runners on same IDC node
          docker stop "${{ env.CONTAINER_NAME }}"

      - name: Store Core dumps on GitHub
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: coredumps-2card-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: ./**/core.[1-9]*

      - name: Teardown XPU
        if: always()
        shell: bash
        run: |
          # Prune all stopped containers.
          # If other runner is pruning on this node, will skip.
          nprune=$(ps -ef | grep -c "docker container prune")
          if [[ $nprune -eq 1 ]]; then
            docker container prune -f
          fi

      - name: Runner diskspace health check
        uses: pytorch/pytorch/.github/actions/diskspace-cleanup@main
        if: always()
